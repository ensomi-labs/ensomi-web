name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:site
      - run: npm run typecheck
      - run: npm run build:site
      - run: npm run check:pages
      - run: npm run test:site

  # Merges a Dependabot npm pull request once `checks` passes. npm version updates are off in
  # .github/dependabot.yml, so these are security updates. A major version, more than one
  # dependency, or a head other than the commit these checks ran on waits for a person.
  dependabot:
    needs: checks
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn' && !contains(steps.meta.outputs.dependency-names, ',') && (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --merge --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
